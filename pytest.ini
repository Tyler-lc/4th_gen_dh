[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    regression: marks tests that verify results match golden baseline (Fold A)
    equivalence: marks tests that verify seeded old == seeded new code (Fold B)
    smoke: marks smoke tests (imports, config paths)
    slow: marks tests that take a long time to run
